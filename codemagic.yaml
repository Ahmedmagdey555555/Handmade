workflows:
  consumer-app:
    name: Handmade Egypt - Consumer App
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter Android & Build APK
        script: |
          # إنشاء مجلدات أندرويد و iOS تلقائياً لو مش موجودة
          flutter create . --platforms=android --org com.handmade.egypt
          flutter pub get
          flutter build apk --target=lib/consumer_app/main_consumer.dart --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  artisan-app:
    name: Handmade Egypt - Artisan App
    environment:
